<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Web-markdown</title><link rel="stylesheet" href="index.css"></head>
<body><header><span class="badge">Wm</span><div><h1>Web-markdown</h1><p>让当前正文换上你的主题</p></div></header>
<main>
  <label for="theme">正文主题</label><select id="theme"></select>
  <label for="selector">正文区域 <span>可留空尝试识别</span></label>
  <input id="selector" placeholder="例如 article 或 .post-content" autocomplete="off">
  <button id="locate" class="secondary">识别正文</button>
  <div id="target" class="target">先识别正文，再确认应用。</div>
  <label class="check"><input id="confirm" type="checkbox" disabled>我确认高亮区域是文章正文</label>
  <div class="actions"><button id="apply" disabled>应用主题</button><button id="restore" class="secondary">恢复原样</button></div>
  <p id="status" role="status" aria-live="polite"></p>
  <details id="reportBox" hidden><summary>转换报告</summary><pre id="report"></pre></details>
  <p class="hint">保留原页面布局与代码配色。测试主题用于验证流程。</p>
</main><footer><button id="options" class="link">导入与管理主题 →</button><span>0.1.0</span></footer>
<script type="module" src="index.js"></script></body></html>
