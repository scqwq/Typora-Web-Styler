<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Web-markdown · 日志</title><link rel="stylesheet" href="../options/index.css"><link rel="stylesheet" href="index.css"></head><body><main>
<header><span class="eyebrow">WEB-MARKDOWN / 日志</span><h1>查看主题处理情况</h1><a href="../options/index.html">返回主题与配置</a><p>仅保存在本机，最多 300 条，容量最多约 1.5 MB。记录页面来源与路径，省略查询参数、正文、CSS 原文和资源内容。导出的日志可能包含网站路径或主题名称，分享前请检查。</p></header>
<section><div class="toolbar"><label>级别<select id="level"><option value="">全部</option><option value="success">成功</option><option value="warning">警告</option><option value="error">错误</option></select></label><label>类型<select id="category"><option value="">全部</option><option value="import">导入</option><option value="conversion">转换</option><option value="detection">正文识别</option><option value="application">应用与恢复</option><option value="settings">配置</option></select></label><label>搜索<input id="search" type="search" placeholder="消息、页面路径或详细信息"></label></div>
<p><button id="refresh">刷新</button> <button id="export">导出 JSON</button> <button id="clear">清空日志</button></p><p id="status" role="status" aria-live="polite"></p><div id="entries"></div></section>
</main><script type="module" src="index.js"></script></body></html>
